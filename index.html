<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a0a38" />
  <meta name="description" content="GTA VI NZ Countdown — counting down to midnight NZDT on 19 November 2026." />
  <meta property="og:title" content="GTA VI NZ Countdown" />
  <meta property="og:description" content="Countdown to midnight NZDT on 19 November 2026." />
  <meta property="og:type" content="website" />
  <title>GTA VI NZ Countdown</title>

  <link rel="preload" href="display-condensed-bold.woff" as="font" type="font/woff" crossorigin />
  <style>
    @font-face {
      font-family: "Countdown Condensed";
      src: url("display-condensed-bold.woff") format("woff");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --white: #fff8ff;
      --muted: #ead9ef;
      --pink: #ffc0e6;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #1b0523;
      color: var(--white);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: stretch;
      overflow: hidden;
    }

    .artwork {
      position: absolute;
      inset: 0 0 0 37%;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(90deg, #1b0523, transparent 20%),
        url("lucia-vice-city.webp") 39% top / cover no-repeat;
    }

    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background:
        radial-gradient(circle at 14% 34%, rgba(255, 69, 190, .22), transparent 30%),
        radial-gradient(circle at 78% 22%, rgba(110, 57, 255, .10), transparent 27%),
        linear-gradient(180deg, transparent 58%, rgba(7, 0, 12, .42) 100%);
    }

    .page::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: .06;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.7) 0,
          rgba(255,255,255,.7) 1px,
          transparent 1px,
          transparent 3px
        );
      mix-blend-mode: soft-light;
    }

    .content {
      width: min(44%, 760px);
      min-height: 100vh;
      min-height: 100svh;
      padding:
        max(28px, env(safe-area-inset-top))
        clamp(18px, 3.5vw, 64px)
        max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 2vw, 28px);
      position: relative;
      z-index: 2;
    }

    .brand {
      display: block;
      width: min(100%, clamp(228px, 24vw, 360px));
      height: auto;
      filter: drop-shadow(0 10px 20px rgba(10, 0, 19, .55));
    }

    .region {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .flag {
      display: block;
      flex: none;
      width: 80px;
      height: auto;
      box-shadow: 0 0 0 1px rgba(255,255,255,.32), 0 3px 12px rgba(0,0,0,.28);
    }

    h1 {
      font-family: "Countdown Condensed", system-ui, sans-serif;
      font-weight: 700;
      margin: 0;
      font-size: clamp(1.05rem, 1.8vw, 1.6rem);
      line-height: 1.15;
      letter-spacing: .07em;
      text-transform: uppercase;
      text-shadow: 0 3px 16px rgba(0,0,0,.55);
    }

    .countdown {
      width: min(100%, 36rem);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(6px, .85vw, 12px);
    }

    .unit {
      min-width: 0;
      padding: clamp(12px, 1.8vw, 24px) 3px clamp(10px, 1.45vw, 19px);
      border: 1px solid rgba(255, 171, 224, .32);
      border-radius: clamp(10px, 1.3vw, 18px);
      background: linear-gradient(160deg, rgba(92, 38, 88, .85), rgba(27, 10, 39, .96));
      box-shadow: inset 0 1px rgba(255,255,255,.08), 0 8px 24px rgba(0,0,0,.25);
      text-align: center;
    }

    .unit:last-child {
      border-color: rgba(255, 137, 207, .62);
      color: var(--pink);
    }

    .num {
      display: block;
      font-family: "Countdown Condensed", system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(2.55rem, 5.15vw, 5.5rem);
      line-height: .95;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 18px rgba(255, 146, 216, .27);
    }

    .label {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: clamp(.6rem, .83vw, .76rem);
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .released .unit {
      border-color: rgba(255,255,255,.5);
    }

    @media (max-width: 860px) {
      .page {
        flex-direction: column;
      }

      .artwork {
        position: relative;
        inset: auto;
        height: clamp(210px, 48svh, 470px);
        background:
          linear-gradient(180deg, transparent 83%, #1b0523),
          url("lucia-vice-city.webp") 46% top / cover no-repeat;
      }

      .content {
        flex: 1;
        width: 100%;
        min-height: 0;
        padding-top: 12px;
      }

      .brand {
        width: clamp(138px, 44vw, 246px);
      }

      .num {
        font-size: clamp(2.5rem, 11vw, 4.5rem);
      }
    }

    @media (max-width: 560px) {
      .content {
        padding-left: max(14px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right));
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }

      .region {
        gap: 12px;
      }

      .flag {
        width: 66px;
      }

      .label {
        letter-spacing: .055em;
      }
    }
  </style>
</head>

<body>
  <main class="page" id="page">
    <div class="artwork" aria-hidden="true"></div>
    <section class="content" aria-labelledby="title">
      <img class="brand" src="gta-vi-logo.png" width="880" height="681" alt="Grand Theft Auto VI" />
      <div class="region">
        <img class="flag" src="new-zealand-flag.svg" width="80" height="40" alt="" />
        <h1 id="title">New Zealand countdown</h1>
      </div>

      <div class="countdown" role="timer" aria-live="off" aria-label="Time remaining until GTA VI releases in New Zealand">
        <div class="unit">
          <span class="num" id="days">--</span>
          <span class="label">Days</span>
        </div>
        <div class="unit">
          <span class="num" id="hours">--</span>
          <span class="label">Hours</span>
        </div>
        <div class="unit">
          <span class="num" id="minutes">--</span>
          <span class="label">Minutes</span>
        </div>
        <div class="unit">
          <span class="num" id="seconds">--</span>
          <span class="label">Seconds</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Exact NZ release instant: 12:00 AM NZDT, 19 Nov 2026.
    // NZDT is UTC+13 on this date, so this remains correct no matter
    // what timezone the visitor's device is using.
    const RELEASE_AT = Date.parse("2026-11-19T00:00:00+13:00");

    const page = document.getElementById("page");
    const heading = document.getElementById("title");

    const nodes = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds"),
    };

    function pad2(value) {
      return String(value).padStart(2, "0");
    }

    function updateNumber(name, value) {
      const text = pad2(value);
      const node = nodes[name];

      if (node.textContent !== text) {
        node.textContent = text;
      }
    }

    function render() {
      const remaining = Math.max(0, RELEASE_AT - Date.now());
      const complete = remaining === 0;
      page.classList.toggle("released", complete);
      const headingText = complete ? "Countdown complete" : "New Zealand countdown";
      if (heading.textContent !== headingText) heading.textContent = headingText;

      const totalSeconds = Math.ceil(remaining / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      updateNumber("days", days);
      updateNumber("hours", hours);
      updateNumber("minutes", minutes);
      updateNumber("seconds", seconds);

      // Keep the browser tab useful when the page is in the background.
      if (remaining > 0) {
        document.title =
          `${days}d ${pad2(hours)}:${pad2(minutes)}:${pad2(seconds)} — GTA VI NZ Countdown`;
      } else {
        document.title = "GTA VI NZ Countdown — Countdown complete";
      }
    }

    let tickTimeout;

    // Read the actual clock each tick and realign to the next second.
    // A delayed or backgrounded browser never accumulates countdown drift.
    function tick() {
      clearTimeout(tickTimeout);
      render();
      tickTimeout = setTimeout(tick, 1000 - (Date.now() % 1000) + 10);
    }

    tick();
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) tick();
    });
    window.addEventListener("pageshow", tick);
    window.addEventListener("focus", tick);
  </script>

</body>
</html>
