<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2a0a38" />
  <meta name="description" content="GTA VI NZ Countdown — counting down to midnight NZDT on 19 November 2026." />
  <meta property="og:title" content="GTA VI NZ Countdown" />
  <meta property="og:description" content="Countdown to midnight NZDT on 19 November 2026." />
  <meta property="og:type" content="website" />
  <title>GTA VI NZ Countdown</title>

  <link rel="preload" href="display-extrabold.woff" as="font" type="font/woff" crossorigin />
  <style>
    @font-face {
      font-family: "Countdown Display";
      src: url("display-extrabold.woff") format("woff");
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Countdown Condensed";
      src: url("display-condensed-bold.woff") format("woff");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --pink: #ff54bc;
      --pink-2: #ff77ca;
      --violet: #7d3cff;
      --orange: #ff9c5a;
      --white: #fff8ff;
      --muted: #ead9ef;
      --panel: rgba(31, 7, 39, 0.84);
      --panel-2: rgba(18, 4, 25, 0.72);
      --border: rgba(255, 113, 205, 0.88);
      --shadow: 0 0 20px rgba(255, 74, 190, .42),
                0 0 55px rgba(255, 74, 190, .18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #130018;
      color: var(--white);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: stretch;
      overflow: hidden;
    }

    /* Clean background artwork has room above the subject's full head. */
    .artwork {
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(90deg,
          rgb(27, 5, 35) 0%,
          rgb(38, 8, 48) 44%,
          rgba(18, 4, 26, .12) 62%,
          rgba(9, 2, 16, .14) 100%
        ),
        url("gta6-countdown-bikini-art.png") center top / cover no-repeat;
    }

    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background:
        radial-gradient(circle at 14% 34%, rgba(255, 69, 190, .22), transparent 30%),
        radial-gradient(circle at 78% 22%, rgba(110, 57, 255, .10), transparent 27%),
        linear-gradient(180deg, transparent 58%, rgba(7, 0, 12, .42) 100%);
    }

    .page::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: .06;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.7) 0,
          rgba(255,255,255,.7) 1px,
          transparent 1px,
          transparent 3px
        );
      mix-blend-mode: soft-light;
    }

    .content {
      width: min(760px, 92vw);
      min-height: 100vh;
      min-height: 100svh;
      padding:
        max(28px, env(safe-area-inset-top))
        clamp(18px, 5vw, 72px)
        max(28px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 2;
    }

    .badge {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      background: rgba(12, 2, 18, .42);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 25px rgba(0,0,0,.22);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 800;
      font-size: clamp(.72rem, 1.4vw, .9rem);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .flag {
      width: 25px;
      height: 16px;
      object-fit: cover;
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.18);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: .12em;
      margin: 18px 0 2px;
      font-family: "Countdown Display", system-ui, sans-serif;
      font-weight: 800;
      font-size: clamp(3.8rem, 9vw, 7.7rem);
      line-height: 1;
      letter-spacing: -.065em;
      text-transform: uppercase;
      text-shadow: 0 4px 0 rgba(0,0,0,.55);
    }

    .brand .vi {
      display: block;
      flex: none;
      width: 1.04em;
      height: .77em;
      overflow: visible;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,.4));
    }

    h1 {
      font-family: "Countdown Condensed", system-ui, sans-serif;
      font-weight: 700;
      margin: 22px 0 15px;
      font-size: clamp(1.45rem, 3.1vw, 2.65rem);
      line-height: .96;
      letter-spacing: .035em;
      text-transform: uppercase;
      text-shadow: 0 3px 16px rgba(0,0,0,.55);
    }

    .countdown {
      width: min(720px, 100%);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      border-radius: 28px;
      overflow: hidden;
      border: 3px solid var(--border);
      background:
        linear-gradient(180deg, rgba(71, 22, 72, .88), rgba(29, 5, 38, .92));
      box-shadow: var(--shadow), inset 0 0 22px rgba(255, 255, 255, .03);
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
    }

    .unit {
      position: relative;
      text-align: center;
      padding: clamp(18px, 3.4vw, 32px) 8px clamp(13px, 2.4vw, 20px);
      min-width: 0;
    }

    .unit:not(:last-child)::after {
      content: "";
      position: absolute;
      right: 0;
      top: 22%;
      height: 56%;
      width: 1px;
      background: rgba(255,255,255,.45);
      box-shadow: 0 0 10px rgba(255,255,255,.15);
    }

    .num {
      display: block;
      font-family: "Countdown Condensed", system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(2.6rem, 7.4vw, 5.3rem);
      line-height: .9;
      letter-spacing: .015em;
      font-variant-numeric: tabular-nums;
      text-shadow:
        0 0 12px rgba(255, 255, 255, .23),
        0 0 20px rgba(255, 76, 189, .22);
      transform: translateZ(0);
    }

    .num.bump {
      animation: bump .23s ease-out;
    }

    @keyframes bump {
      0%   { transform: translateY(-5px) scale(1.035); filter: brightness(1.3); }
      100% { transform: translateY(0) scale(1); filter: brightness(1); }
    }

    .label {
      display: block;
      margin-top: 11px;
      color: #f7e7fa;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(.62rem, 1.2vw, .88rem);
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .release {
      margin-top: 20px;
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-start;
      text-transform: uppercase;
      text-shadow: 0 3px 15px rgba(0,0,0,.75);
    }

    .release .small {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: clamp(.66rem, 1.2vw, .9rem);
      font-weight: 900;
      letter-spacing: .2em;
      color: #f5e7f8;
    }

    .release .date {
      font-family: "Countdown Condensed", system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(1.18rem, 2.5vw, 2rem);
      line-height: 1.05;
      color: var(--pink-2);
    }

    .status {
      margin-top: 17px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: .82rem;
      font-weight: 750;
      color: rgba(255,255,255,.82);
    }

    .pulse {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ff62c5;
      box-shadow: 0 0 0 0 rgba(255, 98, 197, .55);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      70% { box-shadow: 0 0 0 10px rgba(255, 98, 197, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 98, 197, 0); }
    }

    .released .countdown {
      border-color: rgba(255,255,255,.88);
      box-shadow:
        0 0 25px rgba(255,255,255,.3),
        0 0 65px rgba(255, 79, 188, .22);
    }

    .released .pulse {
      background: #75ffb0;
    }

    .released .release .date {
      color: #fff;
    }

    @media (max-width: 860px) {
      .artwork {
        background-position: 80% top;
        background-image:
          linear-gradient(90deg, rgba(27, 5, 35, .90), rgba(38, 8, 48, .30) 45%, rgba(9, 2, 16, .14)),
          url("gta6-countdown-bikini-art.png");
      }

      .content {
        width: 100%;
        justify-content: flex-end;
        padding-top: 24vh;
        background:
          linear-gradient(
            180deg,
            rgba(20,0,29,0) 0%,
            rgba(20,0,29,.30) 30%,
            rgba(20,0,29,.92) 64%,
            rgba(15,0,22,.98) 100%
          );
      }

      .brand {
        font-size: clamp(3.2rem, 15vw, 6.2rem);
      }
    }

    @media (max-width: 560px) {
      .content {
        padding-left: max(14px, env(safe-area-inset-left));
        padding-right: max(14px, env(safe-area-inset-right));
        padding-bottom: max(20px, env(safe-area-inset-bottom));
      }

      .countdown {
        border-radius: 20px;
        border-width: 2px;
      }

      .unit {
        padding-left: 4px;
        padding-right: 4px;
      }

      .label {
        letter-spacing: .07em;
        font-size: .59rem;
      }

      h1 {
        margin-top: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="page" id="page">
    <div class="artwork" aria-hidden="true"></div>
    <section class="content" aria-labelledby="title">
      <div class="badge">
        <svg class="flag" viewBox="0 0 60 30" role="img" aria-label="New Zealand flag">
          <rect width="60" height="30" fill="#012169"/>
          <g transform="scale(.5)">
            <path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="6"/>
            <path d="M0 0L60 30M60 0L0 30" stroke="#C8102E" stroke-width="3"/>
            <path d="M30 0V30M0 15H60" stroke="#fff" stroke-width="10"/>
            <path d="M30 0V30M0 15H60" stroke="#C8102E" stroke-width="6"/>
          </g>
          <g fill="#CC142B" stroke="#fff" stroke-width=".7">
            <path d="M42 5l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.2-2.4 1.2.5-2.6-1.9-1.8 2.6-.4z"/>
            <path d="M51 11l1.1 2.2 2.4.4-1.8 1.7.4 2.4-2.1-1.1-2.2 1.1.4-2.4-1.7-1.7 2.4-.4z"/>
            <path d="M44 20l1.1 2.2 2.4.4-1.8 1.7.4 2.4-2.1-1.1-2.2 1.1.4-2.4-1.7-1.7 2.4-.4z"/>
            <path d="M53 22l.9 1.8 2 .3-1.4 1.4.3 2-1.8-.9-1.8.9.4-2-1.5-1.4 2-.3z"/>
          </g>
        </svg>
        New Zealand release
      </div>

      <div class="brand" aria-hidden="true">
        <span>GTA</span>
        <svg class="vi" viewBox="0 0 120 100" focusable="false">
          <defs>
            <linearGradient id="vi-colour" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#a16aff" />
              <stop offset=".52" stop-color="#ff54bc" />
              <stop offset="1" stop-color="#ffa454" />
            </linearGradient>
          </defs>
          <path fill="url(#vi-colour)" d="M0 0h26l21 66L68 0h26L59 100H35zM100 0h20v100h-20z" />
        </svg>
      </div>

      <h1 id="title">New Zealand Release Countdown</h1>

      <div class="countdown" role="timer" aria-live="off" aria-label="Time remaining until GTA VI releases in New Zealand">
        <div class="unit">
          <span class="num" id="days">--</span>
          <span class="label">Days</span>
        </div>
        <div class="unit">
          <span class="num" id="hours">--</span>
          <span class="label">Hours</span>
        </div>
        <div class="unit">
          <span class="num" id="minutes">--</span>
          <span class="label">Minutes</span>
        </div>
        <div class="unit">
          <span class="num" id="seconds">--</span>
          <span class="label">Seconds</span>
        </div>
      </div>

      <div class="release">
        <span class="small" id="releaseLabel">Releases in New Zealand</span>
        <span class="date">12:00 AM NZDT, Thursday, 19 November 2026</span>
      </div>

      <div class="status">
        <span class="pulse"></span>
        <span id="statusText">Live countdown · updates every second</span>
      </div>
    </section>
  </main>

  <script>
    // Exact NZ release instant: 12:00 AM NZDT, 19 Nov 2026.
    // NZDT is UTC+13 on this date, so this remains correct no matter
    // what timezone the visitor's device is using.
    const RELEASE_AT = Date.parse("2026-11-19T00:00:00+13:00");

    const page = document.getElementById("page");
    const statusText = document.getElementById("statusText");
    const releaseLabel = document.getElementById("releaseLabel");

    const nodes = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds"),
    };

    const previous = { days: null, hours: null, minutes: null, seconds: null };

    function pad2(value) {
      return String(value).padStart(2, "0");
    }

    function updateNumber(name, value) {
      const text = name === "days" ? String(value) : pad2(value);
      const node = nodes[name];

      if (node.textContent !== text) {
        node.textContent = text;

        if (previous[name] !== null) {
          node.classList.remove("bump");
          void node.offsetWidth;
          node.classList.add("bump");
        }

        previous[name] = value;
      }
    }

    function render() {
      const now = Date.now();
      let remaining = RELEASE_AT - now;

      const complete = remaining <= 0;
      remaining = Math.max(0, remaining);
      page.classList.toggle("released", complete);
      statusText.textContent = complete
        ? "Countdown complete"
        : "Live countdown · updates every second";
      releaseLabel.textContent = complete
        ? "19 November 2026 has arrived"
        : "Releases in New Zealand";

      const totalSeconds = Math.ceil(remaining / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      updateNumber("days", days);
      updateNumber("hours", hours);
      updateNumber("minutes", minutes);
      updateNumber("seconds", seconds);

      // Keep the browser tab useful when the page is in the background.
      if (remaining > 0) {
        document.title =
          `${days}d ${pad2(hours)}:${pad2(minutes)}:${pad2(seconds)} — GTA VI NZ Countdown`;
      } else {
        document.title = "GTA VI NZ Countdown — Countdown complete";
      }
    }

    let tickTimeout;

    // Read the actual clock each tick and realign to the next second.
    // A delayed or backgrounded browser never accumulates countdown drift.
    function tick() {
      clearTimeout(tickTimeout);
      render();
      tickTimeout = setTimeout(tick, 1000 - (Date.now() % 1000) + 10);
    }

    tick();
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) tick();
    });
    window.addEventListener("pageshow", tick);
    window.addEventListener("focus", tick);
  </script>
</body>
</html>
